# Tested environment: 1x NVIDIA H200, Python 3.9. Versions below are the ones the paper's runs used.
name: crci-mem
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
    - gymnasium==1.0.0
    - minigrid==3.0.0
    - stable-baselines3==2.4.1
    - torch==2.4.0
    - numpy==1.26.3
    - hydra-core>=1.3
    - wandb>=0.16
    - pandas>=2.1
    - matplotlib>=3.9
    - seaborn>=0.13
    - tqdm>=4
