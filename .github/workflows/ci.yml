name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Import + gym.make smoke
        run: python -c "import crci_mem, gymnasium as gym; gym.make('MemoryDecayExp_9x9-v0'); gym.make('MemoryDecayMDP_9x9-v0'); print('import OK')"
      - name: Run tests
        run: pytest -q
