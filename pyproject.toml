[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crci_mem"
version = "0.1.0"
description = "Modeling belief-biased agents: a computational-rational user model with online nested-particle-filter inference (AAAI 2026)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yifan Zhu" }]
keywords = ["reinforcement-learning", "computational-rationality", "particle-filter", "assistive-agents", "gymnasium"]
# Versions are the tested ones (1x NVIDIA H200, Python 3.9).
dependencies = [
    "gymnasium==1.0.0",
    "minigrid==3.0.0",
    "stable-baselines3==2.4.1",
    "torch>=2.4",
    "numpy>=1.26,<2.0",
    "hydra-core>=1.3",
    "wandb>=0.16",
    "pandas>=2.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Yifan-Zhu/More-Than-Irrational-Modeling-Belief-Biased-Agents"
Paper = "https://arxiv.org/abs/2511.12359"
Website = "https://yifan-zhu.github.io/AAAI26-Belief-Biased-Agents-Website/"

[tool.setuptools.packages.find]
include = ["crci_mem*"]

[tool.pytest.ini_options]
pythonpath = ["."]      # so `pytest` finds crci_mem from the repo root without `pip install -e .`
markers = ["slow: longer-running tests (e.g. a tiny training loop)"]
